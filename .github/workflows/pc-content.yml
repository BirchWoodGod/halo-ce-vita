name: PC content integration
on:
  workflow_dispatch:
  push:
    branches: [integration/pc-features]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths: ['port/**', 'source/**', 'tools/**', '.github/workflows/pc-content.yml']
permissions:
  contents: read
concurrency:
  group: vita-kevin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  vita:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VITASDK: /home/runner/vitasdk
      VITASDK_CHANNEL: '2026.08'
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld ninja-build cmake python3-pytest python3-venv python3-tk xvfb xauth libarchive-tools
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: /home/runner/vitasdk
          key: vita-sdk-2026-08-vdpm-c9ba33b-sdl-3-4-18-v1
      - name: SDK tools on PATH
        run: echo "$VITASDK/bin" >> "$GITHUB_PATH"
      - name: VitaSDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/vitasdk/vdpm "$RUNNER_TEMP/vdpm"
          git -C "$RUNNER_TEMP/vdpm" checkout c9ba33bd428ba88052f79d78592f4b318a7a322b
          "$RUNNER_TEMP/vdpm/bootstrap-vitasdk.sh"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
      - name: SDL3 for Vita
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/sdl-build" \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl-build" --parallel 4
          cmake --install "$RUNNER_TEMP/sdl-build"
      - uses: actions/cache/save@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/vitasdk
          key: vita-sdk-2026-08-vdpm-c9ba33b-sdl-3-4-18-v1
      - name: Validated map reader tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror port/vita/tests/kevin_gametype_test.c -o "$RUNNER_TEMP/kevin-gametype-test"
          "$RUNNER_TEMP/kevin-gametype-test"
          cc -std=c99 -Wall -Wextra -Werror port/vita/tests/kevin_fx_test.c -o "$RUNNER_TEMP/kevin-fx-test"
          "$RUNNER_TEMP/kevin-fx-test"
          cc -std=c99 -Wall -Wextra -Werror port/vita/tests/kevin_bot_profiles_test.c -o "$RUNNER_TEMP/kevin-bot-test"
          "$RUNNER_TEMP/kevin-bot-test"
          cc -O2 -std=c99 -Wall -Wextra -Werror -pthread port/vita/host/vita_atomics.c port/vita/tests/vita_atomics_test.c -o "$RUNNER_TEMP/vita-atomics-test"
          "$RUNNER_TEMP/vita-atomics-test"
          python3 -m pytest -q tools/test_cache_file_formats.py tools/test_bmp_files.py tools/test_kevin_fleet.py
      - name: Installer input and FTP tests
        run: |
          python3 -m venv "$RUNNER_TEMP/installer-tests"
          "$RUNNER_TEMP/installer-tests/bin/pip" install pytest==9.1.1 pyftpdlib==2.2.0
          xvfb-run -a "$RUNNER_TEMP/installer-tests/bin/python" -m pytest -q tools/installer/tests
      - name: Build Vita package
        run: |
          python3 configure.py --lto off --pgo off --portable --release
          ninja -j4 vita
          python3 -m zipfile -t build/vita/halo.vpk
          sha256sum build/vita/halo.vpk build/vita/eboot.bin > build/vita/SHA256SUMS
          git rev-parse HEAD > build/vita/SOURCE-COMMIT.txt
          "$VITASDK/bin/vdpm" status > build/vita/SDK-STATUS.txt
